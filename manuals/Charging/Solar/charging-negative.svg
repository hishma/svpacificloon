<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" role="img">
<title>Charging circuit — negative side and shunt</title>
<desc>House bank negative through the shunt to the negative bus. MPPT negatives must land load-side of the shunt.</desc>
<style>
  text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .tn { font-size: 11px; font-weight: 400; fill: #5F5E5A; font-style: italic; }
  .arr { stroke: #444441; stroke-width: 2; fill: none; }
  .sig { stroke: #888780; stroke-width: 1.2; fill: none; }
  .purple rect { fill: #EEEDFE; stroke: #7F77DD; }
  .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
  .gray rect { fill: #F1EFE8; stroke: #888780; }
  .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
  .amber rect { fill: #FAEEDA; stroke: #BA7517; }
  .amber .th { fill: #633806; } .amber .ts { fill: #854F0B; }
  .red rect { fill: #FCEBEB; stroke: #A32D2D; }
  .red .th { fill: #791F1F; } .red .ts { fill: #A32D2D; }
</style>
<rect x="0" y="0" width="760" height="480" fill="#ffffff"/>
<defs>
  <marker id="arrowD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text class="th" x="30" y="28" fill="#3d3d3a">Negative side — the shunt determines what gets counted</text>

<g class="purple"><rect x="230" y="52" width="300" height="46" rx="8" stroke-width="0.5"/>
<text class="ts" x="380" y="75" text-anchor="middle" dominant-baseline="central">House bank negative — 4 × Lifeline GC2</text></g>

<line x1="380" y1="98" x2="380" y2="140" class="arr" marker-end="url(#arrowD)"/>
<text class="tn" x="392" y="122">2 × heavy cables through the bulkhead</text>

<g class="gray"><rect x="255" y="144" width="250" height="60" rx="8" stroke-width="2"/>
<text class="th" x="380" y="166" text-anchor="middle" dominant-baseline="central">Shunt</text>
<text class="ts" x="380" y="186" text-anchor="middle" dominant-baseline="central">Brass block, negative side</text></g>

<text class="tn" x="520" y="158">↑ bank side</text>
<text class="tn" x="520" y="196">↓ load side</text>
<line x1="512" y1="174" x2="516" y2="174" class="sig"/>

<g class="gray"><rect x="30" y="144" width="180" height="60" rx="8" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="120" y="166" text-anchor="middle" dominant-baseline="central">Monitor?</text>
<text class="ts" x="120" y="186" text-anchor="middle" dominant-baseline="central">Reads the shunt</text></g>
<path d="M253 174 L216 174" class="sig" stroke-dasharray="4 3" marker-end="url(#arrowL)"/>
<text class="tn" x="222" y="222">small signal wire</text>

<line x1="380" y1="204" x2="380" y2="246" class="arr" marker-end="url(#arrowD)"/>

<g class="gray"><rect x="230" y="250" width="300" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="380" y="272" text-anchor="middle" dominant-baseline="central">Negative bus</text>
<text class="ts" x="380" y="292" text-anchor="middle" dominant-baseline="central">Everything downstream returns here</text></g>

<path d="M175 380 L175 280 L226 280" class="arr" marker-end="url(#arrowD)"/>
<path d="M585 380 L585 280 L534 280" class="arr" marker-end="url(#arrowD)"/>

<g class="amber"><rect x="80" y="384" width="190" height="58" rx="8" stroke-width="0.5"/>
<text class="th" x="175" y="403" text-anchor="middle" dominant-baseline="central">MPPT negatives</text>
<text class="ts" x="175" y="422" text-anchor="middle" dominant-baseline="central">Both 75/10 controllers</text></g>

<g class="gray"><rect x="490" y="384" width="190" height="58" rx="8" stroke-width="0.5"/>
<text class="th" x="585" y="403" text-anchor="middle" dominant-baseline="central">MS2012 + loads</text>
<text class="ts" x="585" y="422" text-anchor="middle" dominant-baseline="central">Yellow cable, existing</text></g>

<g class="red"><rect x="30" y="330" width="700" height="36" rx="6" stroke-width="0.5"/>
<text class="ts" x="380" y="349" text-anchor="middle" dominant-baseline="central">MPPT negatives land HERE — load side. Bank side bypasses the shunt and solar goes uncounted.</text></g>
</svg>
