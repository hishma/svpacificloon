<svg xmlns="http://www.w3.org/2000/svg" width="900" height="898" viewBox="0 0 900 898" role="img">
<title>Pacific Loon — DC Charging System (Negative Side)</title>
<desc>House bank negative through its shunt to the negative bus, where the MPPT negatives must land; plus the separate start-battery negative with its own shunt and monitor.</desc>
<style>
  text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .tn { font-size: 11px; font-weight: 400; fill: #5F5E5A; font-style: italic; }
  .grp { font-size: 14px; font-weight: 500; fill: #5F5E5A; font-style: italic; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
  .sig { stroke: #a8a69d; stroke-width: 1.2; fill: none; }
  .purple rect { fill: #EEEDFE; stroke: #7F77DD; }
  .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
  .teal rect { fill: #E1F5EE; stroke: #1D9E75; }
  .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
  .amber rect { fill: #FAEEDA; stroke: #BA7517; }
  .amber .th { fill: #633806; } .amber .ts { fill: #854F0B; }
  .blue rect { fill: #E6F1FB; stroke: #378ADD; }
  .blue .th { fill: #0C447C; } .blue .ts { fill: #185FA5; }
  .gray rect { fill: #F1EFE8; stroke: #888780; }
  .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
  .id { font-size: 10px; font-weight: 700; fill: #1a1a1a; }
  .icn { fill: none; stroke: #3d3d3a; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .icnf { fill: #3d3d3a; }
</style>
<rect x="0" y="0" width="900" height="898" fill="#ffffff"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowsig" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#a8a69d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>

  <g id="ic-battery"><line class="icn" x1="1" y1="12" x2="6" y2="12"/><line class="icn" x1="6" y1="5" x2="6" y2="19"/><line class="icn" x1="10" y1="9" x2="10" y2="15"/><line class="icn" x1="14" y1="5" x2="14" y2="19"/><line class="icn" x1="18" y1="9" x2="18" y2="15"/><line class="icn" x1="18" y1="12" x2="23" y2="12"/></g>
  <g id="ic-shunt"><rect class="icn" x="3" y="8" width="18" height="8"/><line class="icn" x1="0" y1="12" x2="3" y2="12"/><line class="icn" x1="21" y1="12" x2="24" y2="12"/><text x="12" y="13" text-anchor="middle" dominant-baseline="central" style="font-size:6px;font-weight:700;fill:#3d3d3a">mV</text></g>
  <g id="ic-bus"><line class="icn" x1="2" y1="12" x2="22" y2="12"/><circle class="icnf" cx="7" cy="12" r="1.4"/><circle class="icnf" cx="12" cy="12" r="1.4"/><circle class="icnf" cx="17" cy="12" r="1.4"/></g>
  <g id="ic-ground"><line class="icn" x1="12" y1="3" x2="12" y2="13"/><line class="icn" x1="5" y1="13" x2="19" y2="13"/><line class="icn" x1="8" y1="17" x2="16" y2="17"/><line class="icn" x1="10" y1="21" x2="14" y2="21"/></g>
</defs>

<text x="450" y="34" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#3d3d3a">Pacific Loon — DC Charging System (Negative Side)</text>

<g transform="translate(0,52)">

<!-- ============ HOUSE BANK NEGATIVE GROUP ============ -->
<rect x="40" y="20" width="820" height="512" rx="12" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text class="grp" x="450" y="44" text-anchor="middle">House Bank Return</text>

<!-- bank negative -->
<g class="purple"><rect x="360" y="66" width="180" height="60" rx="8" stroke-width="0.5"/>
<use href="#ic-battery" x="370" y="74"/>
<text class="th" x="458" y="86" text-anchor="middle" dominant-baseline="central">House Bank (−)</text>
<text class="ts" x="450" y="104" text-anchor="middle" dominant-baseline="central">4 × Lifeline GC2</text></g>

<line x1="450" y1="126" x2="450" y2="176" class="arr" marker-end="url(#arrow)"/>
<rect x="409" y="142" width="33" height="18" rx="0" fill="#ffffff" stroke="#c9c7bf" stroke-width="0.5"/><text class="id" x="426" y="151" text-anchor="middle" dominant-baseline="central">HN-1</text><text class="ts" x="458" y="151" dominant-baseline="central" style="font-size:10px;fill:#6b6a64">2/0 AWG</text>

<!-- shunt -->
<g class="gray"><rect x="360" y="180" width="180" height="60" rx="8" stroke-width="1"/>
<use href="#ic-shunt" x="370" y="188"/>
<text class="th" x="458" y="200" text-anchor="middle" dominant-baseline="central">Shunt</text>
<text class="ts" x="450" y="218" text-anchor="middle" dominant-baseline="central">Brass block, negative side</text></g>

<text class="tn" x="552" y="196">↑ bank side</text>
<text class="tn" x="552" y="226">↓ load side</text>

<!-- xantrex monitor -->
<g class="gray"><rect x="120" y="180" width="180" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="205" y="200" text-anchor="middle" dominant-baseline="central">Battery Monitor</text>
<text class="ts" x="205" y="218" text-anchor="middle" dominant-baseline="central">Xantrex LinkLITE</text></g>
<path d="M358 210 L302 210" class="sig" stroke-dasharray="4 3" marker-end="url(#arrowsig)"/>
<rect x="317" y="187" width="27" height="18" rx="0" fill="#ffffff" stroke="#c9c7bf" stroke-width="0.5"/><text class="id" x="330" y="196" text-anchor="middle" dominant-baseline="central">XAN</text>

<line x1="450" y1="240" x2="450" y2="290" class="arr" marker-end="url(#arrow)"/>
<rect x="409" y="256" width="33" height="18" rx="0" fill="#ffffff" stroke="#c9c7bf" stroke-width="0.5"/><text class="id" x="426" y="265" text-anchor="middle" dominant-baseline="central">HN-2</text><text class="ts" x="458" y="265" dominant-baseline="central" style="font-size:10px;fill:#6b6a64">2/0 AWG</text>

<!-- negative bus -->
<g class="gray"><rect x="360" y="294" width="180" height="60" rx="8" stroke-width="0.5"/>
<use href="#ic-bus" x="370" y="302"/>
<text class="th" x="458" y="314" text-anchor="middle" dominant-baseline="central">Negative Bus</text>
<text class="ts" x="450" y="332" text-anchor="middle" dominant-baseline="central">Load side of the shunt</text></g>

<!-- ground reference below bus -->
<line x1="450" y1="354" x2="450" y2="374" class="arr" stroke-dasharray="0"/>
<use href="#ic-ground" x="438" y="374"/>
<text class="tn" x="470" y="390">boat ground</text>

<!-- returns into the bus -->
<path d="M215 408 L215 324 L356 324" class="arr" marker-end="url(#arrow)"/>
<rect x="168" y="357" width="39" height="18" rx="0" fill="#ffffff" stroke="#c9c7bf" stroke-width="0.5"/><text class="id" x="188" y="366" text-anchor="middle" dominant-baseline="central">SOL-<tspan font-style="italic">N</tspan></text><text class="ts" x="223" y="366" dominant-baseline="central" style="font-size:10px;fill:#6b6a64">10 AWG</text>
<path d="M685 408 L685 324 L544 324" class="arr" marker-end="url(#arrow)"/>
<rect x="638" y="357" width="39" height="18" rx="0" fill="#ffffff" stroke="#c9c7bf" stroke-width="0.5"/><text class="id" x="658" y="366" text-anchor="middle" dominant-baseline="central">CHG-<tspan font-style="italic">N</tspan></text><text class="ts" x="693" y="366" dominant-baseline="central" style="font-size:10px;fill:#6b6a64">existing</text>

</g>

<!-- warning band (outside translate so it spans, but keep in group coords) -->
<g transform="translate(0,52)">
<text class="tn" x="450" y="495" text-anchor="middle" dominant-baseline="central">MPPT negatives land on the load side. Bank side bypasses the shunt and the Xantrex SOC drifts high.</text>

<g class="amber"><rect x="120" y="402" width="190" height="54" rx="8" stroke-width="0.5"/>
<text class="th" x="215" y="420" text-anchor="middle" dominant-baseline="central">Solar Controllers</text>
<text class="ts" x="215" y="438" text-anchor="middle" dominant-baseline="central">Victron MPPT 75/10</text></g>

<g class="teal"><rect x="590" y="402" width="190" height="54" rx="8" stroke-width="0.5"/>
<text class="th" x="685" y="420" text-anchor="middle" dominant-baseline="central">Charger/Inverter</text>
<text class="ts" x="685" y="438" text-anchor="middle" dominant-baseline="central">MS2012 + Loads</text></g>

<!-- ============ START BATTERY GROUP ============ -->
<rect x="40" y="576" width="820" height="250" rx="12" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text class="grp" x="450" y="600" text-anchor="middle">Start Battery Return</text>

<g class="blue"><rect x="360" y="648" width="180" height="46" rx="8" stroke-width="0.5"/>
<use href="#ic-battery" x="370" y="663"/>
<text class="th" x="460" y="671" text-anchor="middle" dominant-baseline="central">Start Battery (−)</text></g>

<line x1="450" y1="694" x2="450" y2="750" class="arr" marker-end="url(#arrow)"/>
<rect x="409" y="698" width="33" height="18" rx="0" fill="#ffffff" stroke="#c9c7bf" stroke-width="0.5"/><text class="id" x="426" y="707" text-anchor="middle" dominant-baseline="central">SN-1</text><text class="ts" x="458" y="707" dominant-baseline="central" style="font-size:10px;fill:#6b6a64">4 AWG</text>

<g class="gray"><rect x="360" y="754" width="180" height="30" rx="8" stroke-width="1"/>
<use href="#ic-shunt" x="368" y="757"/>
<text class="th" x="460" y="769" text-anchor="middle" dominant-baseline="central">Start Shunt</text></g>

<g class="gray"><rect x="120" y="742" width="180" height="54" rx="8" stroke-width="0.5"/>
<text class="th" x="205" y="760" text-anchor="middle" dominant-baseline="central">Battery Monitor</text>
<text class="ts" x="205" y="778" text-anchor="middle" dominant-baseline="central">APC Energy Monitor</text></g>
<path d="M358 769 L302 769" class="sig" stroke-dasharray="4 3" marker-end="url(#arrowsig)"/>
<rect x="317" y="746" width="27" height="18" rx="0" fill="#ffffff" stroke="#c9c7bf" stroke-width="0.5"/><text class="id" x="330" y="755" text-anchor="middle" dominant-baseline="central">APC</text>

<path d="M540 769 L596 769" class="arr"/>
<use href="#ic-ground" x="600" y="757"/>
<text class="tn" x="632" y="765">to engine ground</text>
</g>
</svg>
